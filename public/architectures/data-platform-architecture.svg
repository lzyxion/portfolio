<svg viewBox="0 0 1200 550" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>

  <rect width="1200" height="550" rx="20" fill="#F8FAFC"/>
  <text x="64" y="60" font-size="25" font-weight="700" fill="#172554">데이터 표준화 파이프라인 · 멀티테넌시 API</text>
  <text x="64" y="87" font-size="14" fill="#64748B">데이터를 표준화해 저장하고, 테넌트별 권한으로 안전하게 조회하는 흐름</text>

  <!-- Data flow -->
  <text x="64" y="143" font-size="13" font-weight="700" fill="#2563EB">01 · 데이터 처리</text>
  <rect x="64" y="165" width="210" height="112" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="88" y="205" font-size="17" font-weight="700" fill="#1E3A8A">업체별 센서 데이터</text>
  <text x="88" y="232" font-size="13" fill="#64748B">약 50개 고객사 · 2,000개 센서</text>
  <text x="88" y="254" font-size="13" fill="#64748B">하루 약 288만 행 수집</text>

  <rect x="370" y="165" width="240" height="112" rx="16" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.8"/>
  <text x="394" y="205" font-size="18" font-weight="700" fill="#1E3A8A">Airflow · dbt</text>
  <text x="394" y="232" font-size="13" fill="#475569">테넌트별 DAG · 스케줄링</text>
  <text x="394" y="254" font-size="13" fill="#475569">표준화 · 정제 · 집계</text>

  <rect x="706" y="145" width="430" height="152" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="732" y="187" font-size="19" font-weight="700" fill="#172554">공유 TimescaleDB</text>
  <rect x="732" y="204" width="168" height="38" rx="8" fill="#EFF6FF"/>
  <text x="816" y="228" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1D4ED8">Primary · 업체별 DB</text>
  <rect x="915" y="204" width="195" height="38" rx="8" fill="#F1F5F9"/>
  <text x="1012" y="228" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">Replica · 조회 전용</text>
  <text x="732" y="271" font-size="12.5" fill="#64748B">Primary에 적재 · Replica로 복제해 서비스 조회 부하를 분리</text>

  <path d="M278,221 H360" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
  <path d="M614,221 H696" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow-blue)"/>

  <!-- Service flow -->
  <text x="64" y="357" font-size="13" font-weight="700" fill="#1E3A8A">02 · 서비스 조회</text>
  <rect x="64" y="378" width="270" height="88" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="88" y="414" font-size="17" font-weight="700" fill="#334155">관리 대시보드 · 관리자 페이지</text>
  <text x="88" y="439" font-size="13" fill="#64748B">Vue 기반 데이터 조회 · 관리</text>

  <rect x="446" y="360" width="300" height="124" rx="18" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
  <text x="470" y="401" font-size="19" font-weight="700" fill="#172554">FastAPI</text>
  <text x="470" y="428" font-size="13" fill="#475569">JWT · Tenant 식별 · RBAC</text>
  <text x="470" y="452" font-size="13" fill="#475569">Replica 조회 · 장애 시 Primary fallback</text>

  <path d="M338,422 H436" fill="none" stroke="#1E3A8A" stroke-width="2.6" marker-end="url(#arrow-navy)"/>
  <path d="M750,422 H858 Q876,422 876,404 V307" fill="none" stroke="#1E3A8A" stroke-width="2.6" marker-end="url(#arrow-navy)"/>
  <text x="892" y="396" font-size="12" font-weight="600" fill="#1E3A8A">테넌트별 Replica 조회</text>

  <line x1="64" y1="528" x2="1136" y2="528" stroke="#E2E8F0"/>
  <text x="600" y="510" text-anchor="middle" font-size="12" fill="#64748B">핵심: 표준화 파이프라인으로 데이터를 만들고, 하나의 API가 권한에 따라 고객사별 데이터를 제공합니다.</text>
</svg>
