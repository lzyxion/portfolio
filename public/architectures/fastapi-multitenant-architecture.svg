<svg viewBox="0 0 1280 580" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="6.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#6B7683"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="6.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2D9C6F"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="6.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#0E9F8E"/></marker>
    <marker id="arrowMon" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="6.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#7E57C2"/></marker>
  </defs>

  <rect x="0" y="0" width="1280" height="580" fill="#FBFCFE"/>

  <text x="640" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1c2733">Multi-Tenant FastAPI Gateway · 확장형 API 서버</text>
  <text x="640" y="60" text-anchor="middle" font-size="13" fill="#7a8694">X-Tenant-ID 로 테넌트별 DB 동적 라우팅 — read = Replica · write = Primary (장애 시 fallback)</text>

  <!-- Zone bands -->
  <rect x="24"   y="88" width="220" height="452" rx="16" fill="#EAF4FB" stroke="#B6D9F0" stroke-width="1.2"/>
  <rect x="264"  y="88" width="500" height="452" rx="16" fill="#EAF7EF" stroke="#BBE3CB" stroke-width="1.2"/>
  <rect x="784"  y="88" width="200" height="452" rx="16" fill="#F1ECFA" stroke="#CDBCEC" stroke-width="1.2"/>
  <rect x="1004" y="88" width="252" height="452" rx="16" fill="#FBF1E9" stroke="#F0D6BE" stroke-width="1.2"/>

  <text x="134"  y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#2E6B96">클라이언트 · Client</text>
  <text x="514"  y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#2C8C5A">FastAPI Gateway</text>
  <text x="884"  y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#6A4D9E">Master DB</text>
  <text x="1130" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#B5722A">Tenant DBs</text>

  <!-- Client -->
  <rect x="48" y="170" width="172" height="92" rx="14" fill="#E7F5EE" stroke="#41B883" stroke-width="2"/>
  <text x="134" y="208" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2A7A57">관리 대시보드</text>
  <text x="134" y="230" text-anchor="middle" font-size="12" fill="#5C6B7A">Vue · 사용자</text>

  <rect x="48" y="302" width="172" height="92" rx="14" fill="#E7F5EE" stroke="#41B883" stroke-width="2"/>
  <text x="134" y="340" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2A7A57">관리자 페이지</text>
  <text x="134" y="362" text-anchor="middle" font-size="12" fill="#5C6B7A">Vue · 관리자</text>

  <rect x="48" y="428" width="172" height="30" rx="15" fill="#ffffff" stroke="#9CC9E8" stroke-width="1.2"/>
  <text x="134" y="447" text-anchor="middle" font-size="11" font-weight="600" fill="#2E6B96">X-Tenant-ID + JWT</text>

  <!-- Gateway stages -->
  <rect x="284" y="150" width="460" height="88" rx="14" fill="#EDF0F4" stroke="#5D6D7E" stroke-width="2"/>
  <text x="514" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#3E4C5B">① Middleware Chain</text>
  <text x="514" y="208" text-anchor="middle" font-size="12.5" fill="#5C6B7A">CORS · 속도 제한 · 테넌트 식별 (X-Tenant-ID)</text>

  <rect x="284" y="262" width="460" height="88" rx="14" fill="#DFF2F0" stroke="#0E9F8E" stroke-width="2"/>
  <text x="514" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#0A6B60">② Router · RBAC (Casbin)</text>
  <text x="514" y="320" text-anchor="middle" font-size="12.5" fill="#5C6B7A">역할별 권한 검사 · 입력 검증 · OpenAPI 자동 생성</text>

  <rect x="284" y="374" width="460" height="100" rx="14" fill="#E9EDF6" stroke="#44619E" stroke-width="2"/>
  <text x="514" y="408" text-anchor="middle" font-size="16" font-weight="700" fill="#324875">③ Dynamic Engine Routing</text>
  <text x="514" y="432" text-anchor="middle" font-size="12.5" fill="#5C6B7A">write → Primary · read → Replica (장애 시 fallback)</text>
  <text x="514" y="454" text-anchor="middle" font-size="12" fill="#5C6B7A">테넌트별 엔진 lazy 생성 · 캐싱</text>

  <rect x="304" y="494" width="420" height="28" rx="8" fill="#ffffff" stroke="#BBE3CB" stroke-width="1.2"/>
  <text x="514" y="512" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2C8C5A">Background · 센서 오프라인 · 피크 전력 감시 · 사용량 집계</text>

  <!-- Master DB -->
  <rect x="800" y="210" width="168" height="160" rx="14" fill="#EFECF4" stroke="#6A5A7E" stroke-width="2"/>
  <text x="884" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#4A3D5C">Master DB</text>
  <text x="884" y="268" text-anchor="middle" font-size="12" fill="#5C6B7A">PostgreSQL</text>
  <text x="884" y="292" text-anchor="middle" font-size="12" fill="#5C6B7A">테넌트 접속 정보</text>
  <text x="884" y="312" text-anchor="middle" font-size="12" fill="#5C6B7A">RBAC 정책 · 계정</text>
  <text x="884" y="332" text-anchor="middle" font-size="12" fill="#5C6B7A">Audit · 사용량</text>

  <!-- Tenant DBs -->
  <rect x="1024" y="150" width="208" height="78" rx="14" fill="#E4F4EC" stroke="#2D9C6F" stroke-width="2"/>
  <text x="1128" y="182" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1F6B4C">Tenant A · Primary</text>
  <text x="1128" y="204" text-anchor="middle" font-size="11.5" fill="#5C6B7A">write · TimescaleDB</text>

  <rect x="1024" y="248" width="208" height="78" rx="14" fill="#DFF2F0" stroke="#0E9F8E" stroke-width="2"/>
  <text x="1128" y="280" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0A6B60">Tenant A · Replica</text>
  <text x="1128" y="302" text-anchor="middle" font-size="11.5" fill="#5C6B7A">read · Streaming Replica</text>

  <rect x="1024" y="346" width="208" height="58" rx="14" fill="#EFF7F2" stroke="#9CCDB6" stroke-width="2"/>
  <text x="1128" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#4C8067">Tenant B · Primary / Replica</text>
  <text x="1128" y="390" text-anchor="middle" font-size="10.5" fill="#5C6B7A">동일 패턴 분리 운영</text>

  <rect x="1024" y="424" width="208" height="44" rx="14" fill="#ffffff" stroke="#E0B98C" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="1128" y="450" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B5722A">Tenant N ··· 동적 확장</text>

  <!-- Arrows -->
  <path d="M224,216 H250 Q262,216 262,204 V192 Q262,180 274,180 H280" fill="none" stroke="#6B7683" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M224,348 H250 Q262,348 262,336 V222 Q262,210 274,210 H280" fill="none" stroke="#6B7683" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M514,238 V258" fill="none" stroke="#6B7683" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M514,350 V370" fill="none" stroke="#6B7683" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M748,306 H796" fill="none" stroke="#7E57C2" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#arrowMon)"/>

  <path d="M748,420 H988 Q1000,420 1000,408 V202 Q1000,190 1012,190 H1018" fill="none" stroke="#2D9C6F" stroke-width="2.8" marker-end="url(#arrowGreen)"/>
  <path d="M748,450 H976 Q988,450 988,438 V299 Q988,287 1000,287 H1018" fill="none" stroke="#0E9F8E" stroke-width="2.8" marker-end="url(#arrowTeal)"/>

  <!-- Legend -->
  <line x1="360" y1="562" x2="400" y2="562" stroke="#2D9C6F" stroke-width="2.8" marker-end="url(#arrowGreen)"/>
  <text x="407" y="566" font-size="12.5" fill="#2D9C6F">write → Primary</text>
  <line x1="560" y1="562" x2="600" y2="562" stroke="#0E9F8E" stroke-width="2.8" marker-end="url(#arrowTeal)"/>
  <text x="607" y="566" font-size="12.5" fill="#0B8576">read → Replica</text>
  <line x1="760" y1="562" x2="800" y2="562" stroke="#7E57C2" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#arrowMon)"/>
  <text x="807" y="566" font-size="12.5" fill="#6A4399">control plane (정책 · 테넌트 조회)</text>
</svg>
