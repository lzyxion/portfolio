  <path d="M1117,542 V556 Q1117,568 1105,568 H494 Q482,568 482,556 V536" fill="none" stroke="#44619E" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>
  <text x="800" y="560" text-anchor="middle" font-size="11.5" font-weight="600" fill="#44619E">share 단위 증분 동기화</text>

