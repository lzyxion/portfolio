  <text x="990" y="140" text-anchor="middle" font-size="12" fill="#7a8694">OpenAI 호환 API — 임베딩 · 리랭크 · 생성</text>
  <text x="990" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#2E6B96">데이터 · 문서</text>

