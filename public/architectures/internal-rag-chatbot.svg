  <text x="990" y="206" text-anchor="middle" font-size="15.5" font-weight="700" fill="#5B3F94">bge-m3</text>
  <text x="990" y="228" text-anchor="middle" font-size="11.5" fill="#5C6B7A">임베딩</text>
  <rect x="1082" y="166" width="150" height="110" rx="14" fill="#EFEAF8" stroke="#7E57C2" stroke-width="2"/>
