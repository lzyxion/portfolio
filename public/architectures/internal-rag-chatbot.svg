    <marker id="arrowIndigo" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="6.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#44619E"/></marker>
  </defs>

  <rect x="0" y="0" width="1280" height="648" fill="#FBFCFE"/>

  <text x="640" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1c2733">사내 문서 RAG 챗봇 아키텍처</text>
  <text x="640" y="68" text-anchor="middle" font-size="13.5" fill="#7a8694">자체 호스팅 vLLM · LangChain LCEL · pgvector — 사내망 폐쇄 구성</text>

