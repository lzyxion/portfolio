  <text x="129" y="312" text-anchor="middle" font-size="12.5" fill="#5C6B7A">웹 브라우저</text>
  <text x="129" y="334" text-anchor="middle" font-size="12.5" fill="#5C6B7A">React · assistant-ui</text>

