<svg viewBox="0 0 1440 700" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="slate" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="6.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="blue" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="6.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker>
    <marker id="teal" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="6.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
    <marker id="purple" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="6.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="orange" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="6.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker>
  </defs>

  <rect width="1440" height="700" fill="#FBFCFE"/>
  <text x="720" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#172554">데이터 표준화 파이프라인 · 멀티테넌시 API 아키텍처</text>
  <text x="720" y="66" text-anchor="middle" font-size="14" fill="#64748B">공유 Primary 인스턴스의 업체별 DB를 Replica로 복제하고, API가 테넌트별로 조회하는 구조</text>

  <!-- zones -->
  <rect x="24" y="94" width="230" height="530" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <rect x="274" y="94" width="370" height="530" rx="18" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.2"/>
  <rect x="664" y="94" width="320" height="530" rx="18" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
  <rect x="1004" y="94" width="412" height="530" rx="18" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.2"/>
  <text x="139" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1D4ED8">사용자 · Client</text>
  <text x="459" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6D28D9">서비스 · On-Prem</text>
  <text x="824" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#047857">데이터 처리 · On-Prem</text>
  <text x="1210" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#C2410C">공유 DB 인스턴스 · Cloud</text>

  <!-- clients -->
  <rect x="52" y="182" width="174" height="92" rx="14" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/>
  <text x="139" y="219" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">관리 대시보드</text>
  <text x="139" y="243" text-anchor="middle" font-size="12.5" fill="#64748B">Vue · 데이터 조회 · 리포트</text>
  <rect x="52" y="324" width="174" height="92" rx="14" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/>
  <text x="139" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">관리자 페이지</text>
  <text x="139" y="385" text-anchor="middle" font-size="12.5" fill="#64748B">Vue · 테넌트 · 권한 관리</text>
  <rect x="52" y="466" width="174" height="34" rx="17" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="139" y="488" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1D4ED8">JWT · X-Tenant-ID</text>

  <!-- FastAPI -->
  <rect x="304" y="180" width="310" height="226" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.2"/>
  <text x="459" y="219" text-anchor="middle" font-size="20" font-weight="700" fill="#115E59">FastAPI Gateway</text>
  <rect x="326" y="242" width="266" height="42" rx="8" fill="#F0FDFA"/>
  <text x="459" y="268" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F766E">① 테넌트 식별 · 요청 제한</text>
  <rect x="326" y="294" width="266" height="42" rx="8" fill="#F0FDFA"/>
  <text x="459" y="320" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F766E">② RBAC · 입력 검증 · REST API</text>
  <rect x="326" y="346" width="266" height="42" rx="8" fill="#F0FDFA"/>
  <text x="459" y="372" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F766E">③ 테넌트별 read/write 엔진 라우팅</text>
  <rect x="326" y="440" width="266" height="48" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="459" y="469" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">Docker · Nginx · GitLab CI/CD</text>

  <!-- pipeline and shared replica -->
  <rect x="694" y="158" width="260" height="128" rx="16" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.2"/>
  <text x="824" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">Airflow + dbt</text>
  <text x="824" y="220" text-anchor="middle" font-size="13" fill="#475569">테넌트별 DAG · 표준화 · 집계</text>
  <text x="824" y="245" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1D4ED8">staging → intermediate → mart</text>
  <text x="824" y="267" text-anchor="middle" font-size="11.5" fill="#64748B">스케줄 · 재시도 · 백필 · 동시 쓰기 제어</text>
  <rect x="694" y="390" width="260" height="176" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.2"/>
  <text x="824" y="422" text-anchor="middle" font-size="17" font-weight="700" fill="#115E59">TimescaleDB Replica</text>
  <text x="824" y="444" text-anchor="middle" font-size="12" fill="#64748B">사내 공유 Replica 인스턴스 · read-only</text>
  <rect x="714" y="462" width="102" height="72" rx="10" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.2"/>
  <text x="765" y="490" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F766E">Tenant A DB</text>
  <text x="765" y="512" text-anchor="middle" font-size="10.5" fill="#64748B">마트 · read</text>
  <rect x="832" y="462" width="102" height="72" rx="10" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.2"/>
  <text x="883" y="490" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F766E">Tenant B…N</text>
  <text x="883" y="512" text-anchor="middle" font-size="10.5" fill="#64748B">업체별 DB 복제</text>

  <!-- shared primary instance -->
  <rect x="1032" y="154" width="356" height="350" rx="18" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.4"/>
  <text x="1210" y="189" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">TimescaleDB Primary</text>
  <text x="1210" y="211" text-anchor="middle" font-size="12.5" fill="#475569">공유 인스턴스 · write</text>
  <rect x="1054" y="314" width="312" height="58" rx="11" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="1.4"/>
  <text x="1210" y="339" text-anchor="middle" font-size="14" font-weight="700" fill="#6D28D9">Master DB</text>
  <text x="1210" y="360" text-anchor="middle" font-size="11.5" fill="#64748B">테넌트 접속 정보 · RBAC 정책 · 계정</text>
  <rect x="1054" y="392" width="144" height="62" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.4"/>
  <text x="1126" y="419" text-anchor="middle" font-size="14.5" font-weight="700" fill="#166534">Tenant A DB</text>
  <text x="1126" y="440" text-anchor="middle" font-size="11.5" fill="#166534">원본 · mart write</text>
  <rect x="1222" y="392" width="144" height="62" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.4"/>
  <text x="1294" y="419" text-anchor="middle" font-size="14.5" font-weight="700" fill="#166534">Tenant B…N</text>
  <text x="1294" y="440" text-anchor="middle" font-size="11.5" fill="#166534">업체별 DB 분리</text>
  <text x="1210" y="480" text-anchor="middle" font-size="11.5" fill="#64748B">Master DB와 Tenant DB가 하나의 Primary 인스턴스에 공존</text>

  <!-- request and data arrows -->
  <path d="M230,228 H296" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#slate)"/>
  <path d="M230,370 H270 Q282,370 282,358 V252 Q282,240 296,240" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#slate)"/>
  <path d="M618,343 H1048" fill="none" stroke="#7C3AED" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#purple)"/>
  <text x="836" y="333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6D28D9">테넌트 · 권한 · 접속 정보</text>
  <path d="M958,218 H1046" fill="none" stroke="#1D4ED8" stroke-width="2.7" marker-end="url(#blue)"/>
  <text x="1002" y="207" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1D4ED8">원본 read</text>
  <path d="M1046,244 H958" fill="none" stroke="#1D4ED8" stroke-width="2.7" marker-end="url(#blue)"/>
  <text x="1002" y="262" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1D4ED8">mart write</text>
  <path d="M1050,468 H966 Q954,468 954,480 V492" fill="none" stroke="#0F766E" stroke-width="2.8" marker-end="url(#teal)"/>
  <text x="1006" y="458" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0F766E">Streaming Replication · 전체 DB 복제</text>
  <path d="M690,498 H628 Q618,498 618,486 V392" fill="none" stroke="#0F766E" stroke-width="2.7" marker-end="url(#teal)"/>
  <text x="653" y="520" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0F766E">테넌트별 mart read</text>
  <path d="M618,382 H1018 Q1030,382 1030,394 V411 Q1030,423 1048,423" fill="none" stroke="#EA580C" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#orange)"/>
  <text x="822" y="378" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C2410C">Replica 장애 시 해당 Tenant Primary fallback</text>

  <!-- legend -->
  <line x1="426" y1="666" x2="466" y2="666" stroke="#1D4ED8" stroke-width="2.7" marker-end="url(#blue)"/>
  <text x="476" y="670" font-size="12.5" fill="#1D4ED8">ELT 처리</text>
  <line x1="604" y1="666" x2="644" y2="666" stroke="#0F766E" stroke-width="2.7" marker-end="url(#teal)"/>
  <text x="654" y="670" font-size="12.5" fill="#0F766E">복제 · 조회</text>
  <line x1="794" y1="666" x2="834" y2="666" stroke="#7C3AED" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#purple)"/>
  <text x="844" y="670" font-size="12.5" fill="#6D28D9">제어 정보</text>
  <line x1="986" y1="666" x2="1026" y2="666" stroke="#EA580C" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#orange)"/>
  <text x="1036" y="670" font-size="12.5" fill="#C2410C">fallback</text>
</svg>
