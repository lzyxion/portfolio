<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="7" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563EB"/></marker></defs><rect width="1200" height="470" rx="20" fill="#F8FAFC"/><text x="64" y="58" font-size="25" font-weight="700" fill="#172554">IIoT 데이터 수집 · 실시간 관제</text><text x="64" y="85" font-size="14" fill="#64748B">현장에서 수집한 시계열 데이터를 클라우드에 저장하고, 대시보드로 조회하는 흐름</text><text x="64" y="138" font-size="13" font-weight="700" fill="#2563EB">데이터 흐름</text><g fill="#fff" stroke-width="1.8"><rect x="64" y="162" width="190" height="116" rx="16" stroke="#BFDBFE"/><rect x="306" y="162" width="190" height="116" rx="16" stroke="#93C5FD"/><rect x="548" y="162" width="210" height="116" rx="16" stroke="#2563EB"/><rect x="810" y="162" width="170" height="116" rx="16" stroke="#93C5FD"/><rect x="1032" y="162" width="104" height="116" rx="16" stroke="#CBD5E1"/></g><g fill="#172554"><text x="88" y="205" font-size="17" font-weight="700">IoT 센서 · PLC</text><text x="330" y="205" font-size="17" font-weight="700">현장 Edge</text><text x="572" y="205" font-size="18" font-weight="700">TimescaleDB</text><text x="834" y="205" font-size="18" font-weight="700">Grafana</text><text x="1054" y="205" font-size="16" font-weight="700">사용자</text></g><g font-size="12.5" fill="#64748B"><text x="88" y="233">장비별 센서값</text><text x="330" y="233">수집 · OPC UA 변환</text><text x="572" y="233">시계열 저장 · 집계</text><text x="834" y="233">실시간 대시보드</text><text x="1054" y="233">관제 · 분석</text></g><g stroke="#2563EB" stroke-width="2.6" fill="none" marker-end="url(#a)"><path d="M258 220h42"/><path d="M500 220h42"/><path d="M762 220h42"/><path d="M984 220h42"/></g><rect x="64" y="336" width="1072" height="70" rx="14" fill="#EFF6FF"/><text x="88" y="365" font-size="14" font-weight="700" fill="#1D4ED8">담당 범위</text><text x="88" y="390" font-size="13" fill="#475569">TimescaleDB의 조회 쿼리·Continuous Aggregate를 설계하고, Grafana 대시보드에서 현장 데이터를 빠르게 탐색할 수 있도록 구성했습니다.</text><line x1="64" y1="432" x2="1136" y2="432" stroke="#E2E8F0"/></svg>
